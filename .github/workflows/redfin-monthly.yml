name: Monthly Redfin home sale prices

# Redfin updates its Housing Market Tracker in the first days of each month.
# On the 10th we refresh the median sale price per state in src/data/afford.json;
# if it changed, the commit triggers the Cloudflare build and /moving-to-colorado
# shows the new month automatically.
on:
  schedule:
    - cron: "23 15 10 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Redfin states (monthly)
        run: curl -fsSL "https://redfin-public-data.s3.us-west-2.amazonaws.com/redfin_data_center/housing_market/monthly/all_states.csv" -o /tmp/states.csv
      - name: Download Redfin states by property type
        run: curl -fsSL "https://redfin-public-data.s3.us-west-2.amazonaws.com/redfin_data_center/property_types/monthly/all_states.csv" -o /tmp/types.csv
      - name: Update src/data/afford.json
        run: |
          python3 - <<'PY'
          import csv, json
          rows = list(csv.DictReader(open('/tmp/states.csv')))
          k = 'MEDIAN SALE PRICE NSA ($)'
          st = [r for r in rows if r['REGION TYPE'] == 'State' and r['IS SEASONALLY ADJUSTED'] == 'false']
          month = max(r['PERIOD BEGIN'] for r in st)
          price = {}
          for r in st:
              if r['PERIOD BEGIN'] == month and r[k] not in ('NA', ''):
                  name = 'District of Columbia' if r['REGION NAME'] == 'Columbia' else r['REGION NAME']
                  price[name] = int(float(r[k]))
          if len(price) < 45 or 'Colorado' not in price:
              raise SystemExit(f'Redfin file looks wrong: {len(price)} states for {month}')
          a = json.load(open('src/data/afford.json'))
          if month < a['priceMonth']:
              raise SystemExit(f'Older month {month} than {a["priceMonth"]}')
          a['priceMonth'] = month
          a['priceUpdated'] = rows[0]['LAST UPDATED']
          a['price'] = dict(sorted(price.items()))
          sf = [r for r in csv.DictReader(open('/tmp/types.csv')) if r['REGION TYPE'] == 'State' and r['PROPERTY TYPE'] == 'Single Family Residential' and r['IS SEASONALLY ADJUSTED'] == 'false']
          sm = max(r['PERIOD BEGIN'] for r in sf)
          houses = {('District of Columbia' if r['REGION NAME'] == 'Columbia' else r['REGION NAME']): int(float(r[k])) for r in sf if r['PERIOD BEGIN'] == sm and r[k] not in ('NA', '')}
          if len(houses) >= 45 and 'Colorado' in houses:
              a['priceHouses'] = dict(sorted(houses.items())); a['priceHousesMonth'] = sm
          json.dump(a, open('src/data/afford.json', 'w'), indent=1)
          print('Redfin month', month, 'Colorado', price['Colorado'])
          PY
      - name: Louisiana (Redfin does not publish it) from statewide MLS report
        continue-on-error: true
        run: |
          sudo apt-get install -y poppler-utils >/dev/null 2>&1 || true
          m=$(date -u +%Y-%m)
          curl -fsSL -A "Mozilla/5.0" -o /tmp/la.pdf "https://louisiana.stats.showingtime.com/docs/mmi/$m/x/LouisianaREALTORS%C2%AE?src=page"
          pdftotext -layout /tmp/la.pdf /tmp/la.txt
          python3 - <<'PY'
          import re, json, datetime
          t = open('/tmp/la.txt').read()
          mm = re.search(r'([A-Z][a-z]+) (20\d\d) Monthly Snapshot', t)
          med = re.search(r'Median Sales Price (?:increased|decreased|remained)[^$]*\$[\d,]+ to \$([\d,]+)', t) or re.search(r'Median Sales Price[^\n$]*\$[\d,]+\s+\$([\d,]+)', t)
          avg = re.search(r'Average Sales Price\s+\$[\d,]+\s+\$([\d,]+)', t)
          asof = re.search(r'Current as of ([A-Z][a-z]+ \d+, 20\d\d)', t)
          if not (mm and med and avg):
              raise SystemExit('Louisiana report: could not parse')
          month = datetime.datetime.strptime(mm.group(1) + ' ' + mm.group(2), '%B %Y').strftime('%Y-%m-01')
          a = json.load(open('src/data/afford.json'))
          ex = a.setdefault('priceExtra', {}).setdefault('Louisiana', {})
          if ex.get('month', '') > month:
              raise SystemExit('Louisiana: older report')
          lab = datetime.datetime.strptime(month, '%Y-%m-%d').strftime('%b %Y')
          ex.update({'price': int(med.group(1).replace(',', '')), 'average': int(avg.group(1).replace(',', '')), 'month': month,
                     'label': f'MLS, {lab}', 'source': f'ShowingTime Monthly Indicators for Louisiana (statewide MLS data), {mm.group(1)} {mm.group(2)}' + (f', current as of {asof.group(1)}' if asof else ''),
                     'url': f'https://louisiana.stats.showingtime.com/docs/mmi/{month[:7]}/x/LouisianaREALTORS%C2%AE?src=page'})
          json.dump(a, open('src/data/afford.json', 'w'), indent=1)
          print('Louisiana', month, ex['price'], ex['average'])
          PY
      - name: Commit if changed
        run: |
          git config user.name "redfin-bot"
          git config user.email "redfin-bot@users.noreply.github.com"
          git add src/data/afford.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Redfin median sale prices: $(python3 -c "import json;print(json.load(open('src/data/afford.json'))['priceMonth'])")"
          git pull --rebase origin main && git push
