name: Monthly Zillow home values

# Zillow publishes the Home Value Index around mid-month. On the 20th we refresh
# src/data/zhvi.json; if it changed, the commit triggers the Cloudflare build and
# the /moving-to-colorado page shows the new month automatically.
on:
  schedule:
    - cron: "23 15 20 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Zillow ZHVI (states)
        run: curl -fsSL "https://files.zillowstatic.com/research/public_csvs/zhvi/State_zhvi_uc_sfrcondo_tier_0.33_0.67_sm_sa_month.csv" -o /tmp/zhvi.csv
      - name: Write src/data/zhvi.json
        run: |
          python3 - <<'PY'
          import csv, json
          rows = list(csv.reader(open('/tmp/zhvi.csv')))
          h = rows[0]
          month = h[-1]
          vals = {}
          for r in rows[1:]:
              name, v = r[2], r[-1]
              if v:
                  vals[name] = round(float(v))
          need = ['Colorado','Texas','Florida','California','New York','North Carolina','South Carolina','Alabama','Louisiana','Arizona','Tennessee','Georgia','Nevada']
          missing = [s for s in need if s not in vals]
          if missing or len(vals) < 45:
              raise SystemExit(f'ZHVI file looks wrong: missing {missing}, {len(vals)} states')
          old = json.load(open('src/data/zhvi.json'))
          if month < old['month']:
              raise SystemExit(f'Older month {month} than current {old["month"]}')
          out = {'month': month, 'source': old['source'], 'values': vals}
          json.dump(out, open('src/data/zhvi.json', 'w'), indent=1, sort_keys=True)
          print('ZHVI month', month, 'Colorado', vals['Colorado'])
          PY
      - name: Commit if changed
        run: |
          git config user.name "zhvi-bot"
          git config user.email "zhvi-bot@users.noreply.github.com"
          git add src/data/zhvi.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Zillow home values: $(python3 -c "import json;print(json.load(open('src/data/zhvi.json'))['month'])")"
          git pull --rebase origin main && git push
