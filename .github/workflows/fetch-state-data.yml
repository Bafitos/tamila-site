name: Fetch state cost data (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download sources
        run: |
          mkdir -p data-raw
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          get() { code=$(curl -sSL -A "$UA" -o "data-raw/$1" -w '%{http_code}' "$2"); echo "$1 HTTP $code $(wc -c < data-raw/$1)" | tee -a data-raw/status.txt; }
          get tf-income-2026.html "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/"
          get tf-sales-midyear-2026.html "https://taxfoundation.org/data/all/state/2026-sales-tax-rates-midyear/"
          get tf-facts-2026.pdf "https://taxfoundation.org/wp-content/uploads/2026/04/TaxFoundation_FactsFigures26-3-31.pdf"
          get insurify-states.html "https://insurify.com/homeowners-insurance/states/"
          curl -fsSL "https://files.zillowstatic.com/research/public_csvs/zhvi/State_zhvi_uc_sfrcondo_tier_0.33_0.67_sm_sa_month.csv" -o data-raw/zhvi_state.csv || true
      - name: Commit to data branch
        run: |
          git config user.name "data-bot"; git config user.email "data-bot@users.noreply.github.com"
          git checkout -b data/state-costs
          git add -f data-raw
          git commit -m "State cost raw data $(date -u +%F)"
          git push -f origin data/state-costs
