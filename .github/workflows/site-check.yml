name: Site health check

# Weekly: old domain redirects, canonical redirects, key pages and the IndexNow key.
on:
  schedule:
    - cron: "41 13 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check redirects and pages
        run: |
          fail=0
          chk() { # url expected_code expected_location_prefix
            read code loc < <(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$1")
            if [ "$code" = "$2" ] && [[ "$loc" == "$3"* ]]; then echo "OK   $code $1 -> $loc"; else echo "FAIL $code $1 -> $loc (want $2 $3)"; fail=1; fi
          }
          W=https://www.denver-real-estates.com
          chk "https://aspenprohomes.com/" 301 "$W"
          chk "https://www.aspenprohomes.com/sell-for-1-percent" 301 "$W/sell-for-1-percent"
          chk "http://aspenprohomes.com/" 301 ""
          chk "http://denver-real-estates.com/" 301 "$W/"
          chk "https://denver-real-estates.com/va-loans-pcs" 301 "$W/va-loans-pcs"
          chk "$W/index.html" 301 ""
          chk "$W/es" 410 ""
          for p in / /sell-for-1-percent /cost-to-sell-a-house-in-colorado /va-loans-pcs /mortgage /blog /areas/aurora /ru /uk /sitemap.xml /577084c3c7f542d6b6e901180034126e.txt; do chk "$W$p" 200 ""; done
          exit $fail
